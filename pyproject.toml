[project]
name = "halloween_swarm"
version = "0.1.0"
description = "Exorcism Protocol swarm: CrewAI + You.com + Parasail + Discord webhook"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai==1.15.33",
    "mcp==1.30.0",
    "openai==2.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[project.scripts]
halloween_swarm = "halloween_swarm.main:run"
run_crew = "halloween_swarm.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "4dac734c-178f-4da4-a449-c858421d84da"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
